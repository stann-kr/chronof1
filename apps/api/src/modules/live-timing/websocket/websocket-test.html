<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronoF1 WebSocket 테스트</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { margin: 5px; padding: 10px 15px; cursor: pointer; }
        #messages { 
            height: 300px; 
            overflow-y: auto; 
            border: 1px solid #ccc; 
            padding: 10px; 
            background: #f9f9f9; 
            font-family: monospace;
            white-space: pre-wrap;
        }
        .connected { color: green; }
        .disconnected { color: red; }
        .error { color: red; font-weight: bold; }
        .message { color: blue; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ChronoF1 WebSocket 연결 테스트</h1>
        
        <div class="section">
            <h3>연결 상태: <span id="status" class="disconnected">연결 안됨</span></h3>
            <button onclick="connect()">연결</button>
            <button onclick="disconnect()">연결 해제</button>
        </div>
        
        <div class="section">
            <h3>메시지 전송</h3>
            <button onclick="joinSession(1)">세션 1 참가</button>
            <button onclick="startReplay(1)">재생 시작</button>
            <button onclick="pauseReplay()">일시정지</button>
            <button onclick="stopReplay()">정지</button>
            <button onclick="seekReplay(30)">30초로 이동</button>
        </div>
        
        <div class="section">
            <h3>메시지 로그</h3>
            <button onclick="clearMessages()">로그 지우기</button>
            <div id="messages"></div>
        </div>
    </div>

    <!-- Socket.IO 클라이언트 라이브러리를 CDN에서 로드 -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        let socket = null;
        const statusElement = document.getElementById('status');
        const messagesElement = document.getElementById('messages');
        
        function addMessage(message, type = 'message') {
            const timestamp = new Date().toLocaleTimeString();
            const line = `[${timestamp}] ${message}\n`;
            messagesElement.textContent += line;
            messagesElement.scrollTop = messagesElement.scrollHeight;
        }
        
        function connect() {
            try {
                // Socket.IO 클라이언트로 연결 - 명시적 서버 URL 포함
                socket = io('http://localhost:3000/live-timing', {
                    transports: ['websocket', 'polling'],
                    upgrade: true,
                    rememberUpgrade: true,
                    timeout: 5000,
                    forceNew: true
                });
                
                socket.on('connect', () => {
                    statusElement.textContent = '연결됨';
                    statusElement.className = 'connected';
                    addMessage('WebSocket 연결 성공!', 'connected');
                });
                
                socket.on('disconnect', () => {
                    statusElement.textContent = '연결 안됨';
                    statusElement.className = 'disconnected';
                    addMessage('WebSocket 연결 해제', 'disconnected');
                });
                
                socket.on('connect_error', (error) => {
                    statusElement.textContent = '연결 오류';
                    statusElement.className = 'error';
                    addMessage(`연결 오류: ${error.message}`, 'error');
                });
                
                // 메시지 수신 리스너 - 서버에서 'message' 이벤트로 모든 메시지를 전송
                socket.on('message', (data) => {
                    addMessage(`서버 메시지: ${JSON.stringify(data, null, 2)}`);
                });
                
                // 개별 이벤트 리스너도 추가 (혹시 모를 경우를 위해)
                socket.on('timing-update', (data) => {
                    addMessage(`타이밍 업데이트: ${JSON.stringify(data, null, 2)}`);
                });
                
                socket.on('session-joined', (data) => {
                    addMessage(`세션 참가 확인: ${JSON.stringify(data, null, 2)}`);
                });
                
                socket.on('replay-status', (data) => {
                    addMessage(`재생 상태: ${JSON.stringify(data, null, 2)}`);
                });
                
            } catch (error) {
                addMessage(`연결 시도 중 오류: ${error.message}`, 'error');
            }
        }
        
        function disconnect() {
            if (socket) {
                socket.disconnect();
                socket = null;
            }
        }
        
        function sendMessage(event, data) {
            if (!socket || !socket.connected) {
                addMessage('WebSocket이 연결되지 않았습니다!', 'error');
                return;
            }
            
            socket.emit(event, data);
            addMessage(`메시지 전송: ${event} -> ${JSON.stringify(data)}`);
        }
        
        function joinSession(sessionId) {
            sendMessage('join-session', { sessionId });
        }
        
        function startReplay(sessionId) {
            sendMessage('replay-control', {
                type: 'START',
                sessionId,
                speed: 1
            });
        }
        
        function pauseReplay() {
            sendMessage('replay-control', {
                type: 'PAUSE',
                sessionId: 1 // 기본적으로 세션 1 사용
            });
        }
        
        function stopReplay() {
            sendMessage('replay-control', {
                type: 'STOP',
                sessionId: 1 // 기본적으로 세션 1 사용
            });
        }
        
        function seekReplay(timestamp) {
            sendMessage('replay-control', {
                type: 'SEEK',
                sessionId: 1, // 기본적으로 세션 1 사용
                timestamp
            });
        }
        
        function clearMessages() {
            messagesElement.textContent = '';
        }
    </script>
</body>
</html>
