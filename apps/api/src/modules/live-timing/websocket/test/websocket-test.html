<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronoF1 WebSocket 테스트</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f0f0f0; }
        .container { max-width: 1200px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; background-color: #fff; }
        button { margin: 5px; padding: 10px 15px; cursor: pointer; border-radius: 3px; border: 1px solid #ccc; }
        #messages { 
            height: 300px; 
            overflow-y: auto; 
            border: 1px solid #ccc; 
            padding: 10px; 
            background: #f9f9f9; 
            font-family: monospace;
            white-space: pre-wrap;
        }
        .connected { color: green; }
        .disconnected { color: red; }
        .error { color: red; font-weight: bold; }
        .message { color: blue; }

        /* 라이브 타이밍 보드 스타일 */
        #timing-board {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1e1e1e;
            color: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        #timing-board table {
            width: 100%;
            border-collapse: collapse;
        }
        #timing-board th, #timing-board td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid #444;
        }
        #timing-board th {
            background-color: #333;
        }
        .driver-row .team-color {
            display: inline-block;
            width: 5px;
            height: 20px;
            margin-right: 8px;
            vertical-align: middle;
        }
        .fastest-lap { background-color: #5e2a80; color: white; }
        .personal-best { background-color: #2a803f; color: white; }

        /* 프로그레스 바 스타일 */
        #progress-bar-container {
            width: 100%;
            background-color: #ddd;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
        }
        #progress-bar {
            width: 0%;
            height: 20px;
            background-color: #4CAF50;
            border-radius: 5px;
            text-align: center;
            line-height: 20px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ChronoF1 WebSocket 연결 테스트</h1>
        
        <div class="section">
            <h3>연결 상태: <span id="status" class="disconnected">연결 안됨</span></h3>
            <button onclick="connect()">연결</button>
            <button onclick="disconnect()">연결 해제</button>
        </div>
        
        <div class="section">
            <h3>메시지 전송</h3>
            <button onclick="joinSession(1)">세션 1 참가</button>
            <button onclick="startReplay(1)">재생 시작</button>
            <button onclick="pauseReplay()">일시정지</button>
            <button onclick="stopReplay()">정지</button>
            <button onclick="seekReplay(-30)">30초 뒤로</button>
            <button onclick="seekReplay(30)">30초 앞으로</button>
        </div>

        <div class="section" id="live-timing-section">
            <h3>라이브 타이밍</h3>
            <div id="session-info"></div>
            <div id="progress-bar-container" onclick="seekFromProgressBar(event)">
                <div id="progress-bar">0%</div>
            </div>
            <div id="timing-board">
                <table>
                    <thead>
                        <tr>
                            <th>POS</th>
                            <th>DRIVER</th>
                            <th>TEAM</th>
                            <th>LAP</th>
                            <th>LAP TIME</th>
                            <th>GAP</th>
                            <th>S1</th>
                            <th>S2</th>
                            <th>S3</th>
                            <th>SPEED</th>
                            <th>RPM</th>
                            <th>THROTTLE</th>
                            <th>BRAKE</th>
                            <th>GEAR</th>
                            <th>DRS</th>
                            <th>STATUS</th>
                        </tr>
                    </thead>
                    <tbody id="timing-body">
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="section">
            <h3>메시지 로그</h3>
            <button onclick="clearMessages()">로그 지우기</button>
            <div id="messages"></div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        let socket = null;
        const statusElement = document.getElementById('status');
        const messagesElement = document.getElementById('messages');
        const timingBody = document.getElementById('timing-body');
        const sessionInfoElement = document.getElementById('session-info');
        const progressBar = document.getElementById('progress-bar');

        let currentSessionId = null;
        let maxSessionTime = 0;
        let currentSessionTime = 0;
        
        function addMessage(message) {
            const timestamp = new Date().toLocaleTimeString();
            const line = `[${timestamp}] ${message}\n`;
            messagesElement.textContent += line;
            messagesElement.scrollTop = messagesElement.scrollHeight;
        }

        function updateTimingBoard(data) {
            if (data.type !== 'TIMING_UPDATE') return;

            currentSessionTime = data.sessionTime;
            const progressPercent = maxSessionTime > 0 ? (currentSessionTime / maxSessionTime) * 100 : 0;

            sessionInfoElement.innerHTML = `
                <p>
                    <strong>세션:</strong> ${data.sessionId} | 
                    <strong>시간:</strong> ${currentSessionTime.toFixed(3)}s / ${maxSessionTime.toFixed(0)}s |
                    <strong>랩:</strong> ${data.currentLap || 'N/A'} | 
                    <strong>상태:</strong> ${data.sessionStatus}
                </p>
            `;
            progressBar.style.width = `${progressPercent}%`;
            progressBar.textContent = `${Math.floor(progressPercent)}%`;

            const sortedDrivers = data.drivers.sort((a, b) => (a.position || 99) - (b.position || 99));

            timingBody.innerHTML = '';
            sortedDrivers.forEach(driver => {
                const row = document.createElement('tr');
                const teamColor = driver.team.color || '#ffffff';
                row.innerHTML = `
                    <td>${driver.position || 'N/A'}</td>
                    <td><span class="team-color" style="background-color: ${teamColor};"></span>${driver.driver.code}</td>
                    <td>${driver.team.shortName || driver.team.name}</td>
                    <td>${driver.lapNumber || 'N/A'}</td>
                    <td>${formatTime(driver.currentLapTime)}</td>
                    <td>${driver.distanceToDriverAhead ? driver.distanceToDriverAhead.toFixed(1) + 'm' : '-'}</td>
                    <td>${formatTime(driver.sector1Time)}</td>
                    <td>${formatTime(driver.sector2Time)}</td>
                    <td>${formatTime(driver.sector3Time)}</td>
                    <td>${driver.speed ? driver.speed.toFixed(0) : '-'}</td>
                    <td>${driver.rpm ? driver.rpm.toFixed(0) : '-'}</td>
                    <td>${driver.throttle ? driver.throttle.toFixed(0) : '-'}</td>
                    <td>${driver.brake ? '■' : ''}</td>
                    <td>${driver.gear || 'N'}</td>
                    <td>${driver.drs || '-'}</td>
                    <td>${driver.status || 'On Track'}</td>
                `;
                timingBody.appendChild(row);
            });
        }

        function formatTime(ms) {
            if (ms === undefined || ms === null) return '-';
            const date = new Date(ms);
            const minutes = String(date.getUTCMinutes());
            const seconds = String(date.getUTCSeconds()).padStart(2, '0');
            const milliseconds = String(date.getUTCMilliseconds()).padStart(3, '0');
            return `${minutes}:${seconds}.${milliseconds}`;
        }
        
        function connect() {
            socket = io('http://localhost:3000/live-timing', { transports: ['websocket'], forceNew: true });
            
            socket.on('connect', () => {
                statusElement.textContent = '연결됨';
                statusElement.className = 'connected';
                addMessage('WebSocket 연결 성공!');
            });
            
            socket.on('disconnect', () => {
                statusElement.textContent = '연결 안됨';
                statusElement.className = 'disconnected';
                addMessage('WebSocket 연결 해제');
            });
            
            socket.on('message', (data) => {
                addMessage(`서버 메시지: ${JSON.stringify(data, null, 2)}`);
                if (data.type === 'SESSION_INFO') {
                    maxSessionTime = data.session.maxSessionTime || 0;
                }
                if (data.type === 'TIMING_UPDATE') {
                    updateTimingBoard(data);
                }
            });
        }
        
        function disconnect() {
            if (socket) socket.disconnect();
        }
        
        function sendMessage(event, data) {
            if (!socket || !socket.connected) {
                addMessage('WebSocket이 연결되지 않았습니다!');
                return;
            }
            socket.emit(event, data);
            addMessage(`메시지 전송: ${event} -> ${JSON.stringify(data)}`);
        }
        
        function joinSession(sessionId) {
            currentSessionId = sessionId;
            sendMessage('join-session', { sessionId });
        }

        function startReplay(sessionId) {
            currentSessionId = sessionId;
            sendMessage('replay-control', { type: 'START', sessionId, speed: 1 });
        }

        function pauseReplay() {
            if (currentSessionId) sendMessage('replay-control', { type: 'PAUSE', sessionId: currentSessionId });
        }

        function stopReplay() {
            if (currentSessionId) sendMessage('replay-control', { type: 'STOP', sessionId: currentSessionId });
        }

        function seekReplay(timeOffset) {
            if (currentSessionId) {
                const newTime = Math.max(0, currentSessionTime + timeOffset);
                sendMessage('replay-control', { type: 'SEEK', sessionId: currentSessionId, timestamp: newTime });
            }
        }

        function seekFromProgressBar(event) {
            if (maxSessionTime > 0) {
                const rect = event.currentTarget.getBoundingClientRect();
                const clickX = event.clientX - rect.left;
                const percentage = clickX / rect.width;
                const seekTime = maxSessionTime * percentage;
                sendMessage('replay-control', { type: 'SEEK', sessionId: currentSessionId, timestamp: seekTime });
            }
        }
        
        function clearMessages() {
            messagesElement.textContent = '';
        }
    </script>
</body>
</html>
